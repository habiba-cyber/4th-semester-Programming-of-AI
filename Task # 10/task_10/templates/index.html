<!DOCTYPE html>
<html>
<head>
    <title>Hospital Assistant</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='main.css') }}">
</head>
<body>

    <div class="card">
        <h1>Hospital Assistant</h1>

        <form method="POST">
            <input type="text" name="user_text" placeholder="Enter your query" required>
            <button type="submit">Submit</button>
        </form>

        <div class="result">
            <h3>Response</h3>
            <p>{{ response_text }}</p>
        </div>
    </div>

</body>
</html>
