<!DOCTYPE html>
<html>
<head>
    <title>Smart Knowledge Assistant</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='design.css') }}">
</head>
<body>

    <div class="panel">
        <h1>Smart Knowledge Assistant</h1>
        <p>Ask any hospital related question</p>

        <form method="POST">
            <input type="text" name="question" placeholder="Type your question..." required>
            <button type="submit">Search</button>
        </form>

        <div class="output_box">
            <h3>Response</h3>
            <p>{{ result }}</p>
        </div>
    </div>

</body>
</html>
